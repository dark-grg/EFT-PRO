  <body style="margin: 0; padding: 0; background-color: #050B14; color: white;">

      <div style="display: flex; justify-content: center; items-center; height: 100vh; flex-direction: column; gap: 20px; align-items: center; font-family: sans-serif;">

    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; background:black; padding:20px; position:absolute; top:0; left:0; right:0; z-index:9999;"><h3>CRASH!</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
