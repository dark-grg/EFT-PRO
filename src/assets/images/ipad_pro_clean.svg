<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean studio background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="spaceGrayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3135"/>
      <stop offset="50%" stop-color="#1f2327"/>
      <stop offset="100%" stop-color="#121517"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f3f5"/>
      <stop offset="50%" stop-color="#dee2e6"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </linearGradient>
    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- OLED Wallpaper Ribbons -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- 1. BACK TABLET LEFT (Space Gray iPad Pro Back) -->
  <g filter="url(#softShadow)">
    <rect x="85" y="45" width="165" height="245" rx="20" fill="url(#spaceGrayGrad)" stroke="#495057" stroke-width="1.5" />
    <!-- Camera bump module -->
    <rect x="95" y="55" width="38" height="38" rx="8" fill="#181a1b" stroke="#343a40" stroke-width="1.2"/>
    <circle cx="106" cy="66" r="6" fill="#000" stroke="#495057" stroke-width="1.5"/>
    <circle cx="106" cy="66" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="122" cy="66" r="6" fill="#000" stroke="#495057" stroke-width="1.5"/>
    <circle cx="122" cy="66" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="114" cy="81" r="3" fill="#e9ecef"/>
    <!-- LiDAR scanner -->
    <circle cx="123" cy="81" r="2.5" fill="#212529"/>
  </g>

  <!-- 2. BACK TABLET CENTER (Silver iPad Pro Back) -->
  <g filter="url(#softShadow)">
    <rect x="150" y="45" width="165" height="245" rx="20" fill="url(#silverGrad)" stroke="#adb5bd" stroke-width="1.5" />
    <!-- Apple Logo on Silver back -->
    <path d="M 233 145 C 233 139 237 135 241 133 C 239 128 234 125 229 125 C 223 125 220 128 217 128 C 213 128 210 125 205 125 C 197 125 190 131 186 142 C 182 153 185 167 190 174 C 193 179 197 184 202 184 C 206 184 208 181 213 181 C 218 181 220 184 225 184 C 231 184 235 178 238 173 C 242 168 244 162 244 161 C 243 161 233 157 233 145 Z" fill="#6c757d" opacity="0.35"/>
    <!-- Camera bump on Silver -->
    <rect x="160" y="55" width="38" height="38" rx="8" fill="#e9ecef" stroke="#ced4da" stroke-width="1.2"/>
    <circle cx="171" cy="66" r="6" fill="#1a1a1a" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="171" cy="66" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="187" cy="66" r="6" fill="#1a1a1a" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="187" cy="66" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="179" cy="81" r="3" fill="#ffffff"/>
    <circle cx="188" cy="81" r="2.5" fill="#495057"/>
  </g>

  <!-- 3. FRONT TABLET (OLED Screen with Glowing Ribbon Wallpaper) -->
  <g filter="url(#dropShadow)">
    <!-- Chassis -->
    <rect x="215" y="80" width="200" height="275" rx="20" fill="#000000" stroke="#343a40" stroke-width="2"/>
    
    <!-- Screen Display Area -->
    <rect x="223" y="88" width="184" height="259" rx="14" fill="#020408"/>
    
    <!-- OLED Wallpaper Curved Shapes (The iconic iPad Pro wallpaper in user reference) -->
    <g opacity="0.95">
      <!-- Outer ambient glow -->
      <ellipse cx="315" cy="217" rx="80" ry="110" fill="url(#screenGlow)"/>

      <!-- Big Neon Ribbon Loop (Outer Arc) -->
      <path d="M 270 140 C 310 105 380 120 385 180 C 390 240 375 285 320 315 C 275 340 245 315 245 280 C 245 230 350 220 365 170 C 375 130 315 125 285 145 Z" fill="none" stroke="url(#ribbon1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

      <!-- Inner Neon Ribbon Highlight -->
      <path d="M 285 155 C 320 125 365 140 370 185 C 375 235 350 270 315 295 C 280 320 260 295 260 270 C 260 235 335 225 350 180 C 360 145 315 140 295 155" fill="none" stroke="url(#ribbon2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

      <!-- Center Glow Accents -->
      <path d="M 295 170 C 330 145 355 160 358 190 C 360 225 330 250 305 270" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Screen Bezel Camera / FaceID -->
    <ellipse cx="315" cy="94" rx="3" ry="3" fill="#111827"/>
    <circle cx="315" cy="94" r="1.2" fill="#1e3a8a"/>
  </g>

  <!-- Typography matching Apple Branding at bottom -->
  <g transform="translate(250, 425)" text-anchor="middle">
    <!-- Apple Logo -->
    <path d="M -88 -6 C -88 -13 -83 -17 -78 -19 C -81 -25 -86 -28 -92 -28 C -99 -28 -102 -25 -106 -25 C -111 -25 -114 -28 -120 -28 C -130 -28 -139 -20 -144 -8 C -149 5 -145 22 -139 31 C -136 36 -131 42 -125 42 C -120 42 -118 39 -112 39 C -106 39 -104 42 -98 42 C -92 42 -87 35 -83 30 C -79 24 -77 18 -76 17 C -77 17 -88 12 -88 -6 Z" fill="#000000" transform="scale(0.35) translate(40, -10)"/>
    <text x="-5" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#111827" letter-spacing="-0.5">iPad Pro</text>
  </g>
</svg>
