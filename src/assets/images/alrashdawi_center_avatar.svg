<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3C29E" />
      <stop offset="100%" stop-color="#DF9D74" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </linearGradient>
    <linearGradient id="phones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>

  <!-- Bright Yellow Studio Background -->
  <rect width="400" height="400" fill="url(#bg)" />

  <!-- White Shirt & Shoulders -->
  <path d="M80 400 C80 320, 130 290, 200 290 C270 290, 320 320, 320 400 Z" fill="#FFFFFF" />
  <path d="M155 290 C155 330, 245 330, 245 290 Z" fill="url(#skin)" />

  <!-- Iraq Emblem on Chest -->
  <g transform="translate(130, 335) scale(0.65)">
    <path d="M0 0 L40 0 L36 40 L20 52 L4 40 Z" fill="#1e293b" stroke="#000" stroke-width="2"/>
    <rect x="6" y="4" width="28" height="10" fill="#dc2626" />
    <rect x="6" y="14" width="28" height="10" fill="#ffffff" />
    <rect x="6" y="24" width="28" height="10" fill="#000000" />
    <text x="20" y="21" font-family="Arial" font-size="6" font-weight="bold" fill="#16a34a" text-anchor="middle">الله أكبر</text>
  </g>

  <!-- Neck -->
  <path d="M165 220 L165 295 L235 295 L235 220 Z" fill="url(#skin)" />

  <!-- Head Base / Face -->
  <ellipse cx="200" cy="185" rx="62" ry="78" fill="url(#skin)" />

  <!-- Beard & Mustache (Dark Styled) -->
  <path d="M142 180 C140 235, 160 268, 200 268 C240 268, 260 235, 258 180 C254 210, 235 248, 200 248 C165 248, 146 210, 142 180 Z" fill="#1c1917" opacity="0.95" />
  <path d="M172 215 C185 208, 215 208, 228 215 C218 224, 182 224, 172 215 Z" fill="#1c1917" />
  <!-- Lips -->
  <path d="M182 228 C192 225, 208 225, 218 228 C208 234, 192 234, 182 228 Z" fill="#d97706" opacity="0.6" />

  <!-- Eyes and Eyebrows -->
  <!-- Brows -->
  <path d="M152 145 C162 138, 178 140, 186 147" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M248 145 C238 138, 222 140, 214 147" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Eyes -->
  <ellipse cx="170" cy="158" rx="10" ry="6" fill="#ffffff" />
  <circle cx="170" cy="158" r="4.5" fill="#262626" />
  <circle cx="168.5" cy="156.5" r="1.5" fill="#ffffff" />
  <ellipse cx="230" cy="158" rx="10" ry="6" fill="#ffffff" />
  <circle cx="230" cy="158" r="4.5" fill="#262626" />
  <circle cx="228.5" cy="156.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M200 152 L196 195 L204 195 Z" fill="#ca8a04" opacity="0.25" />
  <path d="M194 196 C197 200, 203 200, 206 196" stroke="#78350f" stroke-width="2" fill="none" />

  <!-- Hair Base (Dark Styled Quiff) -->
  <path d="M138 150 C132 80, 160 45, 200 45 C245 45, 268 80, 262 150 C255 110, 230 100, 200 102 C170 100, 145 110, 138 150 Z" fill="url(#hair)" />

  <!-- Signature Silver/White Highlight Stripe in Hair -->
  <path d="M190 48 C195 45, 215 50, 218 85 C210 70, 200 65, 190 48 Z" fill="#e2e8f0" />
  <path d="M182 58 C188 52, 205 60, 208 92 C202 78, 192 72, 182 58 Z" fill="#cbd5e1" />

  <!-- Over-Ear Gaming Headphones -->
  <!-- Headband Arc -->
  <path d="M120 160 C110 70, 290 70, 280 160" stroke="#18181b" stroke-width="16" stroke-linecap="round" fill="none" />
  <path d="M135 125 C145 85, 255 85, 265 125" stroke="#27272a" stroke-width="8" fill="none" />

  <!-- Left Ear Cup (Black & Glowing Purple Ring) -->
  <g transform="translate(100, 130)">
    <ellipse cx="20" cy="45" rx="22" ry="38" fill="url(#phones)" stroke="#09090b" stroke-width="4" />
    <ellipse cx="20" cy="45" rx="14" ry="28" fill="none" stroke="url(#purpleRing)" stroke-width="5" />
    <circle cx="20" cy="45" r="8" fill="#09090b" />
  </g>

  <!-- Right Ear Cup (Black & Glowing Purple Ring) -->
  <g transform="translate(260, 130)">
    <ellipse cx="20" cy="45" rx="22" ry="38" fill="url(#phones)" stroke="#09090b" stroke-width="4" />
    <ellipse cx="20" cy="45" rx="14" ry="28" fill="none" stroke="url(#purpleRing)" stroke-width="5" />
    <circle cx="20" cy="45" r="8" fill="#09090b" />
  </g>
</svg>