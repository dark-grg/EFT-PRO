<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Card Border Gradient - Gold Foil -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Holographic Green / Cyber Matrix Gradient Background -->
    <radialGradient id="holoBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="65%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <linearGradient id="redJersey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <linearGradient id="whiteStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect x="6" y="6" width="488" height="688" rx="28" fill="url(#holoBg)" stroke="url(#cardBorder)" stroke-width="10" filter="url(#cardGlow)"/>
  
  <!-- Cyber Hologram Grid Lines in BG -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1.5">
    <line x1="10" y1="100" x2="490" y2="100"/>
    <line x1="10" y1="200" x2="490" y2="200"/>
    <line x1="10" y1="300" x2="490" y2="300"/>
    <line x1="10" y1="400" x2="490" y2="400"/>
    <line x1="10" y1="500" x2="490" y2="500"/>
    <line x1="100" y1="10" x2="100" y2="690"/>
    <line x1="200" y1="10" x2="200" y2="690"/>
    <line x1="300" y1="10" x2="300" y2="690"/>
    <line x1="400" y1="10" x2="400" y2="690"/>
  </g>

  <!-- TOP LEFT: 104 OVR RATING & CF POSITION & BADGE -->
  <g transform="translate(30, 45)">
    <!-- 104 -->
    <text x="0" y="55" font-family="-apple-system, Impact, 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" stroke="#000000" stroke-width="3">104</text>
    <!-- CF -->
    <text x="18" y="105" font-family="-apple-system, 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" stroke="#000000" stroke-width="2">CF</text>
    
    <!-- MDR Crest Badge -->
    <g transform="translate(2, 120)">
      <rect x="0" y="0" width="75" height="20" rx="3" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
      <text x="37.5" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#1e3a8a">MDR</text>
      <!-- Shield -->
      <polygon points="37.5,65 0,22 75,22" fill="#dc2626" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="37.5" cy="40" r="14" fill="#fbbf24"/>
      <circle cx="37.5" cy="40" r="11" fill="#1e3a8a"/>
    </g>
  </g>

  <!-- CENTER SUAREZ PORTRAIT & ACTION SHOT ARTWORK -->
  <g transform="translate(140, 60)">
    <!-- Head & Face (Close-up) -->
    <ellipse cx="140" cy="115" rx="70" ry="85" fill="#e0a97a"/>
    <!-- Hair -->
    <path d="M 65 95 C 65 35, 215 35, 215 95 C 205 75, 175 60, 140 60 C 105 60, 75 75, 65 95 Z" fill="#171717"/>
    <!-- Beard & Stubble -->
    <path d="M 85 130 C 85 185, 195 185, 195 130 C 185 160, 160 175, 140 175 C 120 175, 95 160, 85 130 Z" fill="#262626" opacity="0.6"/>
    <!-- Eyes & Brows -->
    <path d="M 95 105 Q 115 98 128 105" stroke="#171717" stroke-width="4" fill="none"/>
    <path d="M 152 105 Q 165 98 185 105" stroke="#171717" stroke-width="4" fill="none"/>
    <circle cx="112" cy="114" r="5" fill="#171717"/>
    <circle cx="168" cy="114" r="5" fill="#171717"/>
    <!-- Nose -->
    <path d="M 140 108 L 136 132 L 145 132" stroke="#b45309" stroke-width="2.5" fill="none"/>
    
    <!-- Iconic 3-Finger Kiss Celebration (Hand over mouth) -->
    <!-- Wrist & Red Tape -->
    <rect x="110" y="160" width="55" height="18" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <!-- Hand / Fingers kissing gesture -->
    <g transform="translate(95, 125)">
      <path d="M 30 18 C 30 5, 42 0, 48 15 L 48 40 L 25 40 Z" fill="#f0b98a" stroke="#9a3412" stroke-width="1.5"/>
      <path d="M 45 12 C 47 0, 58 -3, 62 10 L 62 40 L 42 40 Z" fill="#f0b98a" stroke="#9a3412" stroke-width="1.5"/>
      <path d="M 60 16 C 62 4, 73 2, 76 16 L 76 40 L 58 40 Z" fill="#f0b98a" stroke="#9a3412" stroke-width="1.5"/>
    </g>

    <!-- Atletico Madrid Red & White Striped Jersey Torso -->
    <g transform="translate(45, 195)">
      <!-- Base Shirt Body -->
      <path d="M 0 40 L 25 0 L 165 0 L 190 40 L 175 140 L 15 140 Z" fill="#991b1b"/>
      <!-- White Stripes -->
      <rect x="40" y="0" width="26" height="140" fill="url(#whiteStripe)"/>
      <rect x="85" y="0" width="26" height="140" fill="url(#whiteStripe)"/>
      <rect x="130" y="0" width="26" height="140" fill="url(#whiteStripe)"/>
      <!-- Blue Collar Accent -->
      <polygon points="75,0 95,30 115,0" fill="#1e3a8a"/>
    </g>

    <!-- Smaller Action Silhouette Figure In Background -->
    <g transform="translate(60, 210) scale(0.65)">
      <!-- Diving / Sliding Celebration Pose -->
      <ellipse cx="80" cy="40" rx="16" ry="18" fill="#e0a97a"/>
      <!-- Hair -->
      <circle cx="78" cy="30" r="14" fill="#171717"/>
      <!-- Torso Striped -->
      <rect x="65" y="52" width="40" height="50" rx="5" fill="#dc2626"/>
      <rect x="75" y="52" width="10" height="50" fill="#ffffff"/>
      <rect x="92" y="52" width="10" height="50" fill="#ffffff"/>
      <!-- Shorts Blue -->
      <rect x="60" y="100" width="48" height="30" rx="4" fill="#1e3a8a"/>
      <!-- Red Socks & Boots -->
      <path d="M 65 130 L 50 165 L 40 170" stroke="#dc2626" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 95 130 L 125 155 L 140 155" stroke="#dc2626" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- CLUB ATLETICO EMBLEM / CREST WATERMARK (RIGHT) -->
  <g transform="translate(400, 390)">
    <circle cx="0" cy="0" r="32" fill="#7f1d1d" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#fef08a" letter-spacing="1">DESAN LUIS</text>
  </g>

  <!-- PLAYER NAME BANNER: Luis Suárez -->
  <g transform="translate(250, 485)" text-anchor="middle">
    <!-- Drop Shadow for Text -->
    <text x="2" y="2" font-family="-apple-system, 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="1">Luis Suárez</text>
    <text x="0" y="0" font-family="-apple-system, 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">Luis Suárez</text>
  </g>

  <!-- BOTTOM METALLIC FOOTER DOCK (eFootball Booster & 5 Stars) -->
  <g transform="translate(130, 560)">
    <!-- Booster Capsule Frame -->
    <rect x="0" y="0" width="240" height="75" rx="20" fill="#0f172a" stroke="url(#cardBorder)" stroke-width="4"/>
    
    <!-- Dual Cyan Booster Diamonds -->
    <g transform="translate(60, 24)">
      <!-- Booster Diamond 1 -->
      <rect x="-18" y="-12" width="24" height="24" rx="4" transform="rotate(45)" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="-6" cy="0" r="4" fill="#ffffff"/>
      <!-- Booster Diamond 2 -->
      <rect x="22" y="-12" width="24" height="24" rx="4" transform="rotate(45)" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="34" cy="0" r="4" fill="#ffffff"/>
      <!-- eFootball Logo Badge -->
      <circle cx="85" cy="0" r="16" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <text x="85" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff">e</text>
    </g>

    <!-- 5 Golden Stars -->
    <g transform="translate(120, 56)" fill="#facc15" stroke="#ca8a04" stroke-width="1">
      <polygon points=" -60,0 -56,-8 -48,-8 -54,-3 -51,5 -60,0" transform="scale(0.8) translate(-25, -2)"/>
      <polygon points=" -30,0 -26,-8 -18,-8 -24,-3 -21,5 -30,0" transform="scale(0.8) translate(15, -2)"/>
      <polygon points=" 0,0 4,-8 12,-8 6,-3 9,5 0,0" transform="scale(0.8) translate(55, -2)"/>
      <polygon points=" 30,0 34,-8 42,-8 36,-3 39,5 30,0" transform="scale(0.8) translate(95, -2)"/>
      <polygon points=" 60,0 64,-8 72,-8 66,-3 69,5 60,0" transform="scale(0.8) translate(135, -2)"/>
    </g>
  </g>
</svg>
