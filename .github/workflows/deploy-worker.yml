name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy EFT PRO Worker to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Verify Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ Error: CLOUDFLARE_API_TOKEN secret is not set in GitHub Actions Secrets."
            exit 1
          fi
          npx wrangler deploy

      - name: Production Health Check
        run: |
          echo "🔍 Running production health check on https://eft-pro.grg0.workers.dev/api/health ..."
          HEALTH_RESP=$(curl -f -s -S --retry 3 --retry-delay 5 https://eft-pro.grg0.workers.dev/api/health)
          echo "Health Response: $HEALTH_RESP"
          if echo "$HEALTH_RESP" | grep -q '"ok":true'; then
            echo "✅ Production Worker health check PASSED."
          else
            echo "❌ Production Worker health check FAILED."
            exit 1
          fi

      - name: Production Time Check
        run: |
          echo "🔍 Running production time check on https://eft-pro.grg0.workers.dev/api/time ..."
          TIME_RESP=$(curl -f -s -S --retry 3 --retry-delay 5 https://eft-pro.grg0.workers.dev/api/time)
          echo "Time Response: $TIME_RESP"
          if echo "$TIME_RESP" | grep -q '"ok":true'; then
            echo "✅ Production Worker time check PASSED."
          else
            echo "❌ Production Worker time check FAILED."
            exit 1
          fi
